<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>The archive // THE DOSSIER</title>
<meta name="description" content="Every file released in the Dossier, with its date. Filter by subject.">
<meta property="og:title" content="The archive // THE DOSSIER">
<meta property="og:description" content="Every file released so far, with its date. Filter by subject.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/dossier.css">
<style>
  /* Filters are tag chips, not buttons: the solid state is the tag system's
     own hot state, so the page keeps its single solid-green element. */
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:24px 0 0}
  .chip{font-family:var(--font-mono);background:transparent;cursor:pointer;
        border:1px solid var(--line-dim);color:var(--muted);padding:5px 13px;
        font-size:11px;letter-spacing:.14em;text-transform:uppercase;border-radius:0}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);
        color:var(--ink);font-weight:700}

  /* One row per file: number, date, title, subject. Nothing else. */
  .row{display:flex;gap:20px;padding:20px 0;border-top:1px solid var(--line-dim);align-items:baseline}
  .row:last-of-type{border-bottom:1px solid var(--line-dim)}
  .row .no{color:var(--accent);font-weight:700;font-size:13px;letter-spacing:.12em;flex:none;min-width:3.2em}
  .row .body{flex:1;min-width:0}
  .row .ttl{color:var(--phosphor);font-weight:700;font-size:14px;letter-spacing:.06em;
            text-transform:uppercase}
  .row .ttl a{color:inherit}
  .row .ttl a:hover{color:var(--accent-bright)}
  .row .sub{margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
  .empty{padding:32px 0;border-top:1px solid var(--line-dim)}
</style>
</head>
<body>
<div class="stage narrow">

  <div class="nav">
    <a class="logo" href="home.html">The Dossier//</a>
    <div class="links">
      <a href="home.html">How it works</a>
      <a href="mission.html">Mission targets</a>
      <a href="archive.html" style="color:var(--accent)">The archive</a>
      <a href="library.html">The library</a>
      <a href="about.html">Yassine</a>
    </div>
  </div>

  <div class="filehead" style="margin:40px 0 24px">
    <span>The archive</span>
    <span><span data-count>0</span> files on record</span>
  </div>

  <div class="filters" role="group" aria-label="Filter files by subject">
    <button class="chip" data-filter="all" aria-pressed="true">All</button>
    <button class="chip" data-filter="self-development" aria-pressed="false">Self-development</button>
    <button class="chip" data-filter="tools" aria-pressed="false">Tools</button>
    <button class="chip" data-filter="ai-leverage" aria-pressed="false">AI leverage</button>
  </div>

  <!-- ==========================================================
       NEW FILE: the builder inserts rows directly after the
       @files marker below, newest first. Do not remove or
       reword that marker. To add one by hand instead, copy a
       .row and set data-date and data-tags. The count and the
       filters read the rows, so nothing else needs updating.
       ========================================================== -->
  <div style="margin-top:8px">
    <!-- @files -->

    <div class="row" data-file data-date="20260726" data-tags="tools ai-leverage">
      <span class="no">001</span>
      <div class="body">
        <div class="ttl"><a href="guide.html">Make your own podcast on any topic</a></div>
        <div class="sub">
          <span class="micro" data-file-date></span>
          <span class="micro" style="color:var(--line-dim)">//</span>
          <span class="micro" data-file-tags></span>
        </div>
      </div>
    </div>

    <p class="micro empty" data-empty style="display:none">No files under that subject yet.</p>
  </div>

  <div class="foot">
    <span class="micro">The Dossier// End of file</span>
    <span class="micro">Forward at your discretion</span>
  </div>

</div>

<!-- Editor shortcut. Convenience only, not access control: the page is
     public and so is this markup. Publishing is gated by the GitHub token,
     which lives only in the author's browser. -->
<a href="builder.html" data-editor-add title="Build a new file"
   style="display:none;position:fixed;right:26px;bottom:26px;width:54px;height:54px;
          background:var(--accent);color:var(--ink);font-weight:700;font-size:26px;
          line-height:54px;text-align:center;z-index:40">+</a>

<script>
(function(){
  var LABEL = {
    'self-development': 'Self-development',
    'tools': 'Tools',
    'ai-leverage': 'AI leverage'
  };

  var rows  = [].slice.call(document.querySelectorAll('[data-file]'));
  var chips = [].slice.call(document.querySelectorAll('[data-filter]'));
  var empty = document.querySelector('[data-empty]');
  var count = document.querySelector('[data-count]');

  rows.forEach(function(row){
    row.querySelector('[data-file-date]').textContent = 'Filed ' + (row.getAttribute('data-date') || '');
    row.querySelector('[data-file-tags]').textContent =
      (row.getAttribute('data-tags') || '').split(/\s+/).filter(Boolean)
        .map(function(t){ return LABEL[t] || t; }).join(' · ');
  });

  function apply(filter){
    var shown = 0;
    rows.forEach(function(row){
      var tags = ' ' + (row.getAttribute('data-tags') || '') + ' ';
      var hit  = filter === 'all' || tags.indexOf(' ' + filter + ' ') > -1;
      row.style.display = hit ? '' : 'none';
      if (hit) shown++;
    });
    empty.style.display = shown ? 'none' : 'block';
    count.textContent = String(shown).padStart(3, '0');

    // The last visible row carries the closing rule, since :last-of-type
    // still points at a hidden row once a filter is on.
    var visible = rows.filter(function(r){ return r.style.display !== 'none'; });
    rows.forEach(function(r){ r.style.borderBottom = ''; });
    if (visible.length) visible[visible.length - 1].style.borderBottom = '1px solid var(--line-dim)';
  }

  chips.forEach(function(chip){
    chip.addEventListener('click', function(){
      chips.forEach(function(c){ c.setAttribute('aria-pressed', String(c === chip)); });
      apply(chip.getAttribute('data-filter'));
    });
  });

  apply('all');

  // archive.html#editor turns the + on for this browser, #noeditor turns it
  // off again. Nothing here protects anything; it only keeps the button out
  // of a reader's way.
  try {
    if (location.hash === '#editor')   localStorage.setItem('dossier_editor', '1');
    if (location.hash === '#noeditor') localStorage.removeItem('dossier_editor');
    if (localStorage.getItem('dossier_editor') === '1') {
      document.querySelector('[data-editor-add]').style.display = 'block';
    }
  } catch(e){}
})();
</script>
</body>
</html>
