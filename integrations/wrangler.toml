name = "dossier-beehiiv"
main = "beehiiv-worker.js"
compatibility_date = "2026-07-01"

# Not a secret: this only says which origin the browser may call from.
[vars]
ALLOWED_ORIGIN = "https://tahayassine4-svg.github.io"

